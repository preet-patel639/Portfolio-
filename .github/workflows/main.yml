
name: Portfolio CI CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # JOB 1: Validate website code
  validate:
    name: Check Website Code
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          echo "All required files exist!"

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Validate HTML and CSS
        run: |
          npx --yes html-validate@10 index.html
          npx --yes stylelint@16 \
            --config '{"extends":["stylelint-config-standard"]}' \
            styles.css
        continue-on-error: true

  # JOB 2: Deploy website
  deploy:
    name: Deploy Portfolio
    needs: validate

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
